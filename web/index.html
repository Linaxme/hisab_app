<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="আমার দোকান — দোকানের বিক্রি, খরচ আর বাকির হিসাব">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="আমার দোকান">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#09090B">

  <title>আমার দোকান</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">

  <link rel="preload" href="main.dart.js" as="script">
  <!-- Must match firebase_core_web's supportedFirebaseJsSdkVersion, or these downloads are wasted. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js" crossorigin>
  <link rel="preload" href="assets/assets/fonts/HindSiliguri-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/HindSiliguri-Medium.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/HindSiliguri-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/HindSiliguri-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Sora-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Sora-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Sora-ExtraBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #09090B; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, sans-serif; color: #A1A1AA; font-size: 14px;
      transition: opacity .3s;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .bar {
      width: 140px; height: 4px; border-radius: 4px; overflow: hidden;
      background: rgba(198, 242, 78, .15);
    }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #C6F24E; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <div>আমার দোকান লোড হচ্ছে…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
